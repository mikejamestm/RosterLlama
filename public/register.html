<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration · RosterLlama</title><link rel="stylesheet" href="/style.css"></head><body><main class="view" style="max-width:760px"><div class="brand" style="margin:20px 0 50px"><div class="llama">RL</div><b>RosterLlama</b></div><div id="reg"></div></main><script>
const slug=location.pathname.split('/').pop();const money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(c/100);let data;
fetch('/api/public/'+slug).then(r=>r.json()).then(d=>{data=d;document.title='Registration · '+d.organization.name;document.querySelector('#reg').innerHTML='<span class="eyebrow">REGISTRATION</span><h1 style="font-size:44px;letter-spacing:-2px">'+d.organization.name+'</h1><p class="muted">Choose a session and tell us who is attending.</p><div class="panel" style="margin-top:28px"><form id="rf"><label>Session<select id="session">'+d.sessions.map(s=>'<option value="'+s.id+'">'+d.programs.find(p=>p.id===s.program_id).name+' — '+s.label+' · '+money(s.price||d.programs.find(p=>p.id===s.program_id).price)+' · '+s.available+' spots</option>').join('')+'</select></label><label>Parent / guardian name<input id="guardian" required></label><label>Email<input id="remail" type="email" required></label><label>Phone<input id="phone"></label><label>Participant name<input id="child" required></label><label>Age<input id="age"></label><label>Allergies / medical notes<input id="allergies"></label><button class="primary" style="width:100%;margin-top:10px">Complete registration</button><div id="msg"></div></form></div>';document.querySelector('#rf').onsubmit=submit}).catch(()=>document.querySelector('#reg').innerHTML='<div class="panel">Registration page not found.</div>');
async function submit(e){e.preventDefault();let b={session_id:session.value,guardian:guardian.value,email:remail.value,phone:phone.value,child:child.value,age:age.value,allergies:allergies.value};let r=await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();let m=document.querySelector('#msg');if(!r.ok){m.className='error';m.textContent=j.error;return}m.className='panel';m.style.marginTop='18px';m.innerHTML=j.status==='enrolled'?'<b>You’re registered.</b><p>Your spot is confirmed.</p>':'<b>You’re on the waitlist.</b><p>We’ll hold your place in line.</p>';e.target.querySelector('button').disabled=true}
</script></body></html>
