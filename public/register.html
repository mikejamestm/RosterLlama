<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration · RosterLlama</title><link rel="stylesheet" href="/style.css"><style>.regwrap{max-width:880px;margin:0 auto;padding:28px 18px 70px}.regbrand{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.powered{font-size:13px;color:#687078}.reghero h1{font-size:clamp(36px,7vw,58px);letter-spacing:-2px;margin:6px 0}.reggrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(240px,.7fr);gap:18px;align-items:start}.regsummary{position:sticky;top:18px}.regsection{padding:6px 0 16px;border-bottom:1px solid #e7e9e8;margin-bottom:18px}.regsection:last-child{border:0}.question{margin-top:14px}.addon{display:flex;gap:12px;align-items:flex-start;padding:13px;border:1px solid #e2e5e3;border-radius:14px;margin:9px 0}.addon input{width:auto;margin-top:3px}.addon span{display:block}.price{font-size:28px;font-weight:800}.availability{font-size:13px;margin-top:5px}.successbox{padding:22px;border-radius:18px;background:#f4f7f5;margin-top:18px}.hidden{display:none!important}.waiverbox{border:1px solid #dfe3df;border-radius:16px;padding:16px;margin-top:14px}.waiverbox h3{margin:0 0 10px}.waivertext{max-height:220px;overflow:auto;background:#f7f8f6;border-radius:12px;padding:13px;font-size:13px;line-height:1.55;white-space:normal}.primary{background:var(--customer-brand,#171816)}@media(max-width:760px){.reggrid{grid-template-columns:1fr}.regsummary{position:static}.regbrand{margin-bottom:22px}}</style></head><body><div class="regwrap"><div class="regbrand"><div id="orgbrand"><b>RosterLlama</b></div><span class="powered">Secure registration · Powered by RosterLlama</span></div><div id="reg"><div class="panel">Checking availability…</div></div></div><script>
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'demo'),params=new URLSearchParams(location.search),category=params.get('category'),money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((Number(c)||0)/100),esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let data,currentProgram=null;
fetch('/api/public/'+encodeURIComponent(slug)).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Registration page not found');data=d;applyBrand();if(category){const ids=new Set(d.programs.filter(p=>p.category===category).map(p=>p.id));d.sessions=d.sessions.filter(s=>ids.has(s.program_id))}render()}).catch(e=>document.querySelector('#reg').innerHTML='<div class="panel"><h2>Registration unavailable</h2><p class="muted">'+esc(e.message)+'</p></div>');
function applyBrand(){const o=data.organization||{},brand=document.querySelector('#orgbrand');if(/^#[0-9a-f]{6}$/i.test(o.primary_color||''))document.documentElement.style.setProperty('--customer-brand',o.primary_color);brand.innerHTML=o.logo_url?'<img src="'+esc(o.logo_url)+'" alt="'+esc(o.name||'Organization')+'" style="max-width:180px;max-height:58px;object-fit:contain">':'<b>'+esc(o.name||'RosterLlama')+'</b>'}
function programFor(s){return data.programs.find(p=>p.id===s?.program_id)}
function activeSessions(){return data.sessions.filter(s=>s.status==='open')}
function render(){document.title='Registration · '+data.organization.name;const ss=activeSessions();document.querySelector('#reg').innerHTML='<div class="reghero"><span class="eyebrow">REGISTRATION</span><h1>'+esc(data.organization.name)+'</h1><p class="muted">Choose a session, enter participant information, and review your registration.</p></div>'+(ss.length?'<div class="reggrid"><form id="rf" class="panel"><div class="regsection"><h2>1. Choose a session</h2><label>Session<select id="session">'+ss.map(s=>'<option value="'+esc(s.id)+'">'+esc(programFor(s)?.name||'Program')+' — '+esc(s.label)+' · '+(s.available>0?s.available+' open': 'Waitlist')+'</option>').join('')+'</select></label><div id="sessiondetails"></div></div><div class="regsection"><h2>2. Family & participant</h2><label>Parent / guardian name<input id="guardian" required autocomplete="name"></label><label>Email<input id="remail" type="email" required autocomplete="email"></label><label>Phone<input id="phone" type="tel" autocomplete="tel"></label><label>Participant name<input id="child" required></label><div id="agewrap"></div></div><div id="questions" class="regsection"></div><div id="addons" class="regsection hidden"></div><button id="submitbtn" class="primary" style="width:100%">Submit registration</button><div id="msg"></div></form><aside class="panel regsummary"><span class="eyebrow">SUMMARY</span><h3 id="summaryprogram"></h3><p id="summarysession" class="muted"></p><div id="summaryavailability" class="availability"></div><hr><span class="muted">Total</span><div id="summaryprice" class="price"></div><p class="muted" style="font-size:13px">Payment is only collected after the payment system confirms it. A submitted registration will never be shown as paid unless payment is actually confirmed.</p></aside></div>':'<div class="panel"><h2>No sessions are available right now.</h2><p class="muted">Please check back with the program.</p></div>');if(!ss.length)return;document.querySelector('#session').onchange=renderSession;document.querySelector('#rf').onsubmit=submit;renderSession()}
function renderSession(){const s=data.sessions.find(v=>v.id===document.querySelector('#session').value),p=programFor(s);currentProgram=p;const ageText=p.age_min!=null||p.age_max!=null?(p.age_min!=null&&p.age_max!=null?'Ages '+p.age_min+'–'+p.age_max:p.age_min!=null?'Ages '+p.age_min+'+':'Up to age '+p.age_max):'No age restriction';document.querySelector('#sessiondetails').innerHTML='<p class="muted">'+esc(p.description||'')+'</p><div class="programmeta"><span class="chip">'+esc(ageText)+'</span><span class="chip">'+esc(s.status||'open')+'</span></div>';const hasBirthday=(p.questions||[]).some(q=>q.system_key==='birthday');document.querySelector('#agewrap').innerHTML=!hasBirthday&&(p.age_min!=null||p.age_max!=null)?'<label>Age<input id="age" type="number" min="0" max="99" required></label>':'<input id="age" type="hidden" value="">';renderQuestions(p);renderAddons(p);updateSummary()}
function renderQuestions(p){const box=document.querySelector('#questions'),qs=p.questions||[];box.innerHTML=qs.length?'<h2>3. Registration details</h2>'+qs.map(q=>questionHTML(q)).join(''):'';box.classList.toggle('hidden',!qs.length)}
function questionHTML(q){if(q.system_key==='waiver'){const title=esc(data.organization.waiver_title||q.label||'Program waiver'),text=esc(data.organization.waiver_text||'').replaceAll('\n','<br>'),req=q.required?' required':'';return '<div class="waiverbox"><h3>'+title+'</h3>'+(text?'<div class="waivertext">'+text+'</div>':'')+'<label class="addon question"><input data-q="'+esc(q.id)+'" type="checkbox"'+req+'><span><b>I have read and agree to this waiver'+(q.required?' *':'')+'</b></span></label></div>'}const req=q.required?' required':'',star=q.required?' *':'';if(q.type==='textarea')return '<label class="question">'+esc(q.label)+star+'<textarea data-q="'+esc(q.id)+'" rows="3"'+req+'></textarea></label>';if(q.type==='yesno')return '<label class="question">'+esc(q.label)+star+'<select data-q="'+esc(q.id)+'"'+req+'><option value="">Choose…</option><option value="yes">Yes</option><option value="no">No</option></select></label>';if(q.type==='checkbox')return '<label class="addon question"><input data-q="'+esc(q.id)+'" type="checkbox"'+req+'><span><b>'+esc(q.label)+star+'</b></span></label>';if(q.type==='select')return '<label class="question">'+esc(q.label)+star+'<select data-q="'+esc(q.id)+'"'+req+'><option value="">Choose…</option>'+(q.options||[]).map(v=>'<option>'+esc(v)+'</option>').join('')+'</select></label>';const type=['date','number'].includes(q.type)?q.type:'text';return '<label class="question">'+esc(q.label)+star+'<input data-q="'+esc(q.id)+'" type="'+type+'"'+req+'></label>'}
function renderAddons(p){const box=document.querySelector('#addons'),xs=p.addons||[];box.innerHTML=xs.length?'<h2>4. Optional add-ons</h2>'+xs.map(a=>'<label class="addon"><input class="addoncheck" type="checkbox" value="'+esc(a.name)+'"><span><b>'+esc(a.name)+'</b><small>'+(a.start_time&&a.end_time?esc(a.start_time)+'–'+esc(a.end_time)+' · ':'')+money(a.price||0)+'</small></span></label>').join(''):'';box.classList.toggle('hidden',!xs.length);document.querySelectorAll('.addoncheck').forEach(x=>x.onchange=updateSummary)}
function selectedAddons(){return [...document.querySelectorAll('.addoncheck:checked')].map(x=>x.value)}
function updateSummary(){const s=data.sessions.find(v=>v.id===document.querySelector('#session').value),p=programFor(s),addons=(p.addons||[]).filter(a=>selectedAddons().includes(a.name)),total=Number(s.price??p.price??0)+addons.reduce((n,a)=>n+Number(a.price||0),0);document.querySelector('#summaryprogram').textContent=p.name;document.querySelector('#summarysession').textContent=s.label;document.querySelector('#summaryavailability').textContent=s.available>0?s.available+' spot'+(s.available===1?'':'s')+' currently available':'Session is full — submission joins the waitlist';document.querySelector('#summaryprice').textContent=money(total)}
async function submit(e){e.preventDefault();const btn=document.querySelector('#submitbtn'),m=document.querySelector('#msg'),answers={};document.querySelectorAll('[data-q]').forEach(el=>answers[el.dataset.q]=el.type==='checkbox'?el.checked:el.value);const b={session_id:document.querySelector('#session').value,guardian:document.querySelector('#guardian').value,email:document.querySelector('#remail').value,phone:document.querySelector('#phone').value,child:document.querySelector('#child').value,age:document.querySelector('#age')?.value||'',answers,addons:selectedAddons()};btn.disabled=true;btn.textContent='Submitting…';m.textContent='';try{const r=await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'Registration could not be completed');m.className='successbox';m.innerHTML=(j.status==='enrolled'?'<b>Registration received.</b><p>Your participant has an enrolled spot. Payment status: <b>'+esc(j.payment_status||'pending')+'</b>.</p>'+(j.payment_token?'<button type="button" id="continuepayment" class="primary">Continue to secure payment</button><div class="payerror error"></div>':''):'<b>Added to the waitlist.</b><p>Your place in line has been recorded. The program can send a time-limited offer when a spot opens.</p>')+(currentProgram?.allow_multiple_children!==false?'<button type="button" id="anotherchild" class="ghost">Register another child</button>':'');btn.classList.add('hidden');const pay=document.querySelector('#continuepayment');if(pay)pay.onclick=async()=>{const label=pay.textContent;pay.disabled=true;pay.textContent='Opening secure checkout…';try{const rr=await fetch('/api/register/payment',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({payment_token:j.payment_token})}),pj=await rr.json();if(!rr.ok)throw Error(pj.error||'Payment is not available.');if(pj.checkout_url){location.href=pj.checkout_url;return}throw Error('Payment is not available.')}catch(err){const pe=m.querySelector('.payerror');if(pe)pe.textContent=err.message;pay.disabled=false;pay.textContent=label}};const another=document.querySelector('#anotherchild');if(another)another.onclick=()=>{document.querySelector('#child').value='';const age=document.querySelector('#age');if(age)age.value='';document.querySelectorAll('[data-q]').forEach(el=>{if(el.type==='checkbox')el.checked=false;else el.value=''});document.querySelectorAll('.addoncheck').forEach(el=>el.checked=false);m.textContent='';m.className='';btn.classList.remove('hidden');btn.disabled=false;btn.textContent='Submit registration';updateSummary();document.querySelector('#child').focus()}}catch(err){m.className='error';m.textContent=err.message;btn.disabled=false;btn.textContent='Submit registration'}}
</script></body></html>
