<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Portal · RosterLlama</title><link rel="stylesheet" href="/style.css"></head><body><main class="view familyportal"><div class="brand"><div class="llama">RL</div><b>RosterLlama</b></div><section id="familylogin" class="panel familylogin"><span class="eyebrow">FAMILY PORTAL</span><h1>Your family, in one place.</h1><p class="muted">View registrations, children, absences and payment activity.</p><form id="familyloginform"><label>Email<input id="familyemail" type="email" required autocomplete="email"></label><label>Password<input id="familypassword" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button><button type="button" id="activatefamily" class="small">First time here? Activate account</button><div id="familyloginerror" class="error"></div></form></section><section id="familyapp" class="hidden"><div class="familyhead"><div><span class="eyebrow">FAMILY PORTAL</span><h1 id="familyname">Family</h1></div><button id="familylogout">Sign out</button></div><div id="familystats" class="stats"></div><div class="panel"><h2>Children & registrations</h2><div id="familychildren"></div></div><div class="panel"><div class="familysectionhead"><h2>Report an absence</h2></div><form id="absenceform" class="familyaction"><label>Child<select id="absencechild"></select></label><label>Date<input id="absencedate" type="date" required></label><label>Reason<input id="absencereason" placeholder="Optional"></label><button class="primary">Report absence</button><div id="absencemsg"></div></form><div id="absencehistory"></div></div><div class="panel"><h2>Waitlist offers</h2><div id="familyoffers"></div></div><div class="panel"><h2>Payments & receipts</h2><div id="familypayments"></div></div></section><dialog id="receiptdialog"><div class="receiptmodal"><div class="familysectionhead"><h2>Receipt & balance</h2><button type="button" id="receiptclose">Close</button></div><div id="receiptcontent"></div><button type="button" id="receiptprint" class="primary">Print / save receipt</button></div></dialog><dialog id="requestdialog"><form id="requestform" method="dialog"><input id="requestreg" type="hidden"><h2 id="requesttitle">Change registration</h2><label>Request<select id="requesttype"><option value="cancel">Cancel registration</option><option value="transfer">Transfer to another session</option></select></label><label id="requesttargetwrap" class="hidden">New session<select id="requesttarget"></select></label><label>Reason / note<textarea id="requestreason" rows="3"></textarea></label><div class="dialogactions"><button type="button" id="requestcancel">Back</button><button class="primary">Submit request</button></div><div id="requesterror" class="error"></div></form></dialog><dialog id="safetydialog"><form id="safetyform" method="dialog"><input id="safetychild" type="hidden"><h2 id="safetytitle">Child safety information</h2><label>Allergies / medical notes<textarea id="safetyallergies" rows="3"></textarea></label><label>Emergency contact<input id="safetyemergency" placeholder="Name and phone"></label><label>Authorized pickups<textarea id="safetypickups" rows="4" placeholder="One person per line, e.g. Maria Lopez — Aunt"></textarea></label><div class="dialogactions"><button type="button" id="safetycancel">Cancel</button><button class="primary">Save</button></div><div id="safetyerror" class="error"></div></form></dialog></main><script>
const $=s=>document.querySelector(s),money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((c||0)/100);let F;
async function call(url,o={}){let r=await fetch(url,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Something went wrong');return j}
function render(){ $('#familylogin').classList.add('hidden');$('#familyapp').classList.remove('hidden');$('#familyname').textContent=F.family.name||'Your family';let active=F.registrations.filter(r=>r.status==='enrolled').length,wait=F.registrations.filter(r=>r.status==='waitlisted').length;$('#familystats').innerHTML=[['Active registrations',active],['Waitlists',wait],['Children',F.participants.length]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');$('#familychildren').innerHTML=F.participants.map(p=>{let regs=F.registrations.filter(r=>r.participant_id===p.id);return '<div class="familychild"><h3>'+p.name+'</h3><p class="muted">'+(p.allergies?'Medical / allergy note on file':'No medical notes listed')+'</p><button type="button" class="small editprofile" data-id="'+p.id+'">Emergency & pickup info</button>'+regs.map(r=>{let s=F.sessions.find(v=>v.id===r.session_id),pr=F.programs.find(v=>v.id===s?.program_id);return '<div class="familyreg"><div><b>'+(pr?.name||'Program')+'</b><span>'+(s?.label||'Session')+' · '+money(s?.price||pr?.price||0)+'</span><small>'+(r.payment_status==='pending'?'Payment pending':r.payment_status||'')+'</small></div><div><span class="statuschip">'+r.status+'</span> <button class="small receiptbtn" data-id="'+r.id+'">Receipt & balance</button> '+(r.payment_status==='pending'?'<button class="primary payreg" data-id="'+r.id+'">Payment required</button> ':'')+''+(r.status==='enrolled'?'<button class="small regrequest" data-id="'+r.id+'">Change</button>':'')+'</div></div>'}).join('')+'</div>'}).join('')||'<div class="empty">No children or registrations yet.</div>';$('#absencechild').innerHTML=F.participants.map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join('');$('#absencehistory').innerHTML=F.absences.length?'<h3>Reported absences</h3>'+F.absences.slice().reverse().map(x=>'<div class="detail"><span>'+((F.participants.find(p=>p.id===x.participant_id)||{}).name||'Child')+' · '+x.date+'</span><b>'+(x.reason||'Absent')+'</b></div>').join(''):'';document.querySelectorAll('.payreg').forEach(b=>b.onclick=async()=>{try{let x=await call('/api/family/registrations/'+b.dataset.id+'/payment-intent',{method:'POST',body:'{}'});alert(x.message||'Payment ready.')}catch(e){alert(e.message)}});document.querySelectorAll('.receiptbtn').forEach(b=>b.onclick=async()=>{try{let x=await call('/api/family/receipts/'+b.dataset.id);$('#receiptcontent').innerHTML='<div class="receipt"><h3>'+x.program+'</h3><p>'+x.session+' · '+x.participant+'</p><div class="detail"><span>Registration price</span><b>'+money(x.price)+'</b></div><div class="detail"><span>Paid</span><b>'+money(x.paid)+'</b></div><div class="detail"><span>Refunded / pending refund</span><b>'+money(x.refunded)+'</b></div><div class="detail"><span>Balance</span><b>'+money(x.balance)+'</b></div><div class="detail"><span>Payment status</span><b>'+x.payment_status+'</b></div><small>Receipt #'+x.receipt_id+'</small></div>';$('#receiptdialog').showModal()}catch(e){alert(e.message)}});document.querySelectorAll('.regrequest').forEach(b=>b.onclick=()=>{let r=F.registrations.find(v=>v.id===b.dataset.id),s=F.sessions.find(v=>v.id===r.session_id);$('#requestreg').value=r.id;$('#requesttitle').textContent='Change registration';$('#requesttype').value='cancel';$('#requesttarget').innerHTML=F.sessions.filter(v=>v.id!==s.id&&v.status==='open').map(v=>'<option value="'+v.id+'">'+((F.programs.find(p=>p.id===v.program_id)||{}).name||'Program')+' — '+v.label+'</option>').join('');$('#requesttargetwrap').classList.add('hidden');$('#requestreason').value='';$('#requestdialog').showModal()});document.querySelectorAll('.regrequest').forEach(b=>b.onclick=()=>{let r=F.registrations.find(v=>v.id===b.dataset.id),current=F.sessions.find(v=>v.id===r.session_id);$('#requestreg').value=r.id;$('#requesttarget').innerHTML=F.sessions.filter(s=>s.id!==current.id&&s.status==='open').map(s=>'<option value="'+s.id+'">'+((F.programs.find(p=>p.id===s.program_id)||{}).name||'Program')+' — '+s.label+'</option>').join('');$('#requesttype').value='cancel';$('#targetwrap').classList.add('hidden');$('#requestreason').value='';$('#requestdialog').showModal()});document.querySelectorAll('.editprofile').forEach(b=>b.onclick=()=>{let p=F.participants.find(v=>v.id===b.dataset.id);$('#safetychild').value=p.id;$('#safetytitle').textContent=p.name+' — safety information';$('#safetyallergies').value=p.allergies||'';$('#safetyemergency').value=p.emergency_contact||'';$('#safetypickups').value=(p.authorized_pickups||[]).map(v=>(typeof v==='string'?v:(v.name+(v.relationship?' — '+v.relationship:'')))).join('\n');$('#safetyerror').textContent='';$('#safetydialog').showModal()});let offers=(F.waitlist||[]).filter(w=>w.status==='offered');$('#familyoffers').innerHTML=offers.length?offers.map(w=>{let s=F.sessions.find(v=>v.id===w.session_id),pr=F.programs.find(v=>v.id===s?.program_id),exp=w.offer_expires_at?new Date(w.offer_expires_at).toLocaleString():'';return '<div class="familyoffer"><div><b>Spot available: '+(pr?.name||'Program')+'</b><span>'+(s?.label||'Session')+(exp?' · Accept by '+exp:'')+'</span></div><button class="primary acceptoffer" data-id="'+w.id+'">Accept spot</button></div>'}).join(''):'<div class="empty">No active waitlist offers.</div>';document.querySelectorAll('.acceptoffer').forEach(b=>b.onclick=async()=>{if(!confirm('Accept this spot? Payment may still be required.'))return;try{await call('/api/family/waitlist/'+b.dataset.id+'/accept',{method:'POST'});F=await call('/api/family/me');render();alert('Spot accepted.')}catch(e){alert(e.message)}});let pays=F.payments||[];$('#familypayments').innerHTML=pays.length?pays.map(x=>'<div class="detail"><span>'+(x.description||'Payment')+' · '+(x.status||'paid')+'</span><b>'+money(x.amount)+'</b></div>').join('')+(F.refunds.length?'<h3>Refunds</h3>'+F.refunds.map(x=>'<div class="detail"><span>Refund · '+x.status+'</span><b>'+money(x.amount)+'</b></div>').join(''):''):F.refunds.length?F.refunds.map(x=>'<div class="detail"><span>Refund · '+x.status+'</span><b>'+money(x.amount)+'</b></div>').join(''):'<div class="empty">No refund activity.</div>'}
async function boot(){try{F=await call('/api/family/me');render()}catch(e){}}boot();$('#familyloginform').onsubmit=async e=>{e.preventDefault();try{await call('/api/family/login',{method:'POST',body:JSON.stringify({email:$('#familyemail').value,password:$('#familypassword').value})});F=await call('/api/family/me');render()}catch(e){$('#familyloginerror').textContent=e.message}};$('#requesttype').onchange=()=>$('#requesttargetwrap').classList.toggle('hidden',$('#requesttype').value!=='transfer');$('#receiptclose').onclick=()=>$('#receiptdialog').close();$('#receiptprint').onclick=()=>window.print();$('#requestcancel').onclick=()=>$('#requestdialog').close();$('#requestform').onsubmit=async e=>{e.preventDefault();try{await call('/api/family/registrations/'+$('#requestreg').value+'/request',{method:'POST',body:JSON.stringify({type:$('#requesttype').value,target_session_id:$('#requesttarget').value,reason:$('#requestreason').value})});$('#requestdialog').close();F=await call('/api/family/me');render();alert('Request submitted.')}catch(err){$('#requesterror').textContent=err.message}};$('#requestcancel').onclick=()=>$('#requestdialog').close();$('#requesttype').onchange=e=>$('#targetwrap').classList.toggle('hidden',e.target.value!=='transfer');$('#requestform').onsubmit=async e=>{e.preventDefault();try{await call('/api/family/registrations/'+$('#requestreg').value+'/request',{method:'POST',body:JSON.stringify({type:$('#requesttype').value,target_session_id:$('#requesttarget').value,reason:$('#requestreason').value})});$('#requestdialog').close();F=await call('/api/family/me');render()}catch(err){$('#requesterror').textContent=err.message}};$('#safetycancel').onclick=()=>$('#safetydialog').close();$('#safetyform').onsubmit=async e=>{e.preventDefault();let pickups=$('#safetypickups').value.split('\n').map(v=>v.trim()).filter(Boolean).map(v=>{let a=v.split(/\s+[—-]\s+/);return {name:a[0],relationship:a.slice(1).join(' — ')}});try{await call('/api/family/participants/'+$('#safetychild').value,{method:'PATCH',body:JSON.stringify({allergies:$('#safetyallergies').value,emergency_contact:$('#safetyemergency').value,authorized_pickups:pickups})});$('#safetydialog').close();F=await call('/api/family/me');render()}catch(err){$('#safetyerror').textContent=err.message}};$('#absenceform').onsubmit=async e=>{e.preventDefault();let m=$('#absencemsg');try{await call('/api/family/absences',{method:'POST',body:JSON.stringify({participant_id:$('#absencechild').value,date:$('#absencedate').value,reason:$('#absencereason').value})});m.className='success';m.textContent='Absence reported.';F=await call('/api/family/me');render();}catch(err){m.className='error';m.textContent=err.message}};$('#activatefamily').onclick=async()=>{let email=$('#familyemail').value||prompt('Family email address');if(!email)return;let pw=prompt('Create a password (at least 8 characters)');if(!pw)return;try{await call('/api/family/activate',{method:'POST',body:JSON.stringify({email,password:pw})});$('#familyemail').value=email;$('#familypassword').value=pw;alert('Account activated. You can sign in now.')}catch(e){$('#familyloginerror').textContent=e.message}};$('#familylogout').onclick=async()=>{await call('/api/family/logout',{method:'POST'});location.reload()};
</script></body></html>
