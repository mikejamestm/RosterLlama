<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Portal · RosterLlama</title><link rel="stylesheet" href="/style.css"></head><body><main class="view familyportal"><div class="brand"><div class="llama">RL</div><b>RosterLlama</b></div><section id="familylogin" class="panel familylogin"><span class="eyebrow">FAMILY PORTAL</span><h1>Your family, in one place.</h1><p class="muted">View registrations, children, absences and payment activity.</p><form id="familyloginform"><label>Email<input id="familyemail" type="email" required autocomplete="email"></label><button class="primary">Continue</button><div id="familyloginerror" class="error"></div></form></section><section id="familyapp" class="hidden"><div class="familyhead"><div><span class="eyebrow">FAMILY PORTAL</span><h1 id="familyname">Family</h1></div><button id="familylogout">Sign out</button></div><div id="familystats" class="stats"></div><div class="panel"><h2>Children & registrations</h2><div id="familychildren"></div></div><div class="panel"><h2>Payment & refund activity</h2><div id="familypayments"></div></div></section></main><script>
const $=s=>document.querySelector(s),money=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((c||0)/100);let F;
async function call(url,o={}){let r=await fetch(url,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Something went wrong');return j}
function render(){ $('#familylogin').classList.add('hidden');$('#familyapp').classList.remove('hidden');$('#familyname').textContent=F.family.name||'Your family';let active=F.registrations.filter(r=>r.status==='enrolled').length,wait=F.registrations.filter(r=>r.status==='waitlisted').length;$('#familystats').innerHTML=[['Active registrations',active],['Waitlists',wait],['Children',F.participants.length]].map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');$('#familychildren').innerHTML=F.participants.map(p=>{let regs=F.registrations.filter(r=>r.participant_id===p.id);return '<div class="familychild"><h3>'+p.name+'</h3><p class="muted">'+(p.allergies?'Medical / allergy note on file':'No medical notes listed')+'</p>'+regs.map(r=>{let s=F.sessions.find(v=>v.id===r.session_id),pr=F.programs.find(v=>v.id===s?.program_id);return '<div class="familyreg"><div><b>'+(pr?.name||'Program')+'</b><span>'+(s?.label||'Session')+'</span></div><span class="statuschip">'+r.status+'</span></div>'}).join('')+'</div>'}).join('')||'<div class="empty">No children or registrations yet.</div>';$('#familypayments').innerHTML=F.refunds.length?F.refunds.map(x=>'<div class="detail"><span>Refund · '+x.status+'</span><b>'+money(x.amount)+'</b></div>').join(''):'<div class="empty">No refund activity.</div>'}
async function boot(){try{F=await call('/api/family/me');render()}catch(e){}}boot();$('#familyloginform').onsubmit=async e=>{e.preventDefault();try{await call('/api/family/login',{method:'POST',body:JSON.stringify({email:$('#familyemail').value})});F=await call('/api/family/me');render()}catch(e){$('#familyloginerror').textContent=e.message}};$('#familylogout').onclick=async()=>{await call('/api/family/logout',{method:'POST'});location.reload()};
</script></body></html>
