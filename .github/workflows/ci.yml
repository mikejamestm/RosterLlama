name: RosterLlama CI
on:
  push:
    branches: [main, reliability-staging, organized-workspace]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rosterllama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rosterllama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rosterllama
      SESSION_SECRET: ci-session-secret-rosterllama-2026-safe-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node test-reliability.js
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node test-workspace-browser.js
      - name: Syntax check browser clients
        run: |
          node --check public/app.js
          node --check server.js
          node --check database.js
          node --check workflows.js
          node --check publishing.js
          node --check public/pickup.js
          node --check test-workflows.js

